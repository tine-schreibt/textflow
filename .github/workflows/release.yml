name: Release textFlow

on:
  push:
    tags:
      - "*"

env:
  PLUGIN_NAME: textFlow

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Tag ($TAG) does not match manifest.json version ($MANIFEST_VERSION)."
            exit 1
          fi

      - name: Package plugin (only required files)
        run: |
          mkdir -p "${{ env.PLUGIN_NAME }}"
          cp manifest.json "${{ env.PLUGIN_NAME }}/"
          if [ -f main.js ]; then cp main.js "${{ env.PLUGIN_NAME }}/"; else echo "main.js missing" && exit 1; fi
          if [ -f styles.css ]; then cp styles.css "${{ env.PLUGIN_NAME }}/"; fi
          zip -r "${{ env.PLUGIN_NAME }}.zip" "${{ env.PLUGIN_NAME }}"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          files: |
            ${{ env.PLUGIN_NAME }}.zip
            main.js
            manifest.json
            styles.css
